name: Publish to NPM Registry

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Whether to bump the version based on changesets"
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: ".node-version"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run:
          pnpm audit --prod --audit-level high --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq

      - name: Build all packages
        run: pnpm run build

      - name: Bump version
        if: github.event.inputs.version_bump
        run: pnpm changeset version

      - name: Update npm
        run: npm install -g npm@11

      - name: Publish to NPM
        # working-directory: apps/craft
        run: pnpm changeset publish
