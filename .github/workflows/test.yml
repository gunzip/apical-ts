name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test_matrix:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    env:
      TURBO_CACHE_DIR: .turbo-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Setup turbo cache
        if: ${{ env.TURBO_CACHE_DIR != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Build project
        run: pnpm run build

      - name: Run format check
        run: pnpm format:check

      - name: Run lint check
        run: pnpm lint:check

      - name: Generate client and server
        run: pnpm generate

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

  test:
    if: ${{ always() }}
    needs: [test_matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        env:
          MATRIX_RESULT: ${{ needs.test_matrix.result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "Matrix test job concluded with: $MATRIX_RESULT"
            exit 1
          fi
