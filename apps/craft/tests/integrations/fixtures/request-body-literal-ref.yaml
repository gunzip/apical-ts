openapi: 3.1.0
info:
  title: Request Body Literal Ref
  version: 1.0.0
paths:
  /schemas:
    post:
      operationId: createSchema
      requestBody:
        $ref: "#/components/requestBodies/SchemaPayload"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonSchemaProps"
components:
  requestBodies:
    SchemaPayload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JsonSchemaProps"
  schemas:
    JsonSchemaProps:
      type: object
      properties:
        $ref:
          type: string
        description:
          type: string
