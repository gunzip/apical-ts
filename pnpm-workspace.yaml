packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false

auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

catalog:
  '@standard-schema/spec': ^1.1.0
  '@tsconfig/node24': ^24.0.5
  '@types/node': ^24.19.2
  '@vitest/coverage-v8': ^5.0.5
  embedme: ^1.22.1
  oxfmt: ^0.41.0
  typescript: ^7.0.2
  vite: ^8.3.5
  vitest: ^5.0.5
  zod: ^4.6.7

cleanupUnusedCatalogs: true

minimumReleaseAge: 5700

overrides:
  lodash@<=4.17.23: '>=4.18.1'
  postman-collection@4.5.0>@faker-js/faker: 6.3.1
  serialize-javascript@<7.0.5: '>=7.0.5'
  tinypool@<2.1.2: '>=2.1.2'
  uuid@<11.1.1: '>=11.1.1'

packageImportMethod: clone-or-copy
