packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  msw: false

catalog:
  '@standard-schema/spec': ^1.1.0
  '@tsconfig/node22': ^22.0.6
  '@types/node': ^22.20.1
  '@vitest/coverage-v8': ^5.0.0
  embedme: ^1.22.1
  oxfmt: ^0.41.0
  typescript: ^7.0.2
  vite: ^8.2.2
  vitest: ^5.0.0
  zod: ^4.5.4

cleanupUnusedCatalogs: true

minimumReleaseAge: 5700

overrides:
  lodash@<=4.17.23: '>=4.18.1'
  postman-collection@4.5.0>@faker-js/faker: 6.3.1
  serialize-javascript@<7.0.5: '>=7.0.5'

packageImportMethod: clone-or-copy
